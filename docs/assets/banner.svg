<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 280" width="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14"/>
      <stop offset="50%" stop-color="#0B1D36"/>
      <stop offset="100%" stop-color="#071224"/>
    </linearGradient>
    <linearGradient id="iceGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#4CC9F0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.55; transform: scale(1); }
        50% { opacity: 0.95; transform: scale(1.03); }
      }
      @keyframes floatCrystal {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      .crystal { animation: floatCrystal 4s ease-in-out infinite; transform-origin: center; }
      .glow-ring { animation: pulseGlow 3.5s ease-in-out infinite; transform-origin: 135px 140px; }
      .title { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, sans-serif; font-weight: 900; fill: url(#iceGrad); letter-spacing: 3px; }
      .subtitle { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; fill: #B8D4E8; font-weight: 500; }
      .badge-text { font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace; font-size: 13px; font-weight: 700; fill: #00F5D4; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1100" height="280" rx="18" fill="url(#bgGrad)" stroke="#1E4E79" stroke-width="2"/>

  <!-- Subtle Grid Pattern -->
  <g stroke="#13315C" stroke-width="1" opacity="0.45">
    <line x1="0" y1="70" x2="1100" y2="70"/>
    <line x1="0" y1="140" x2="1100" y2="140"/>
    <line x1="0" y1="210" x2="1100" y2="210"/>
    <line x1="260" y1="0" x2="260" y2="280"/>
    <line x1="560" y1="0" x2="560" y2="280"/>
    <line x1="860" y1="0" x2="860" y2="280"/>
  </g>

  <!-- Animated Hex Ice Crystal Logo -->
  <circle class="glow-ring" cx="135" cy="140" r="78" fill="none" stroke="url(#iceGrad)" stroke-width="2" stroke-dasharray="10 6"/>
  <g class="crystal" filter="url(#glow)">
    <polygon points="135,68 197,104 197,176 135,212 73,176 73,104" fill="#0B2545" stroke="url(#iceGrad)" stroke-width="4"/>
    <polygon points="135,90 178,115 178,165 135,190 92,165 92,115" fill="none" stroke="#00F5D4" stroke-width="2" opacity="0.8"/>
    <line x1="135" y1="68" x2="135" y2="212" stroke="#00E5FF" stroke-width="2.5"/>
    <line x1="73" y1="104" x2="197" y2="176" stroke="#00E5FF" stroke-width="2.5"/>
    <line x1="197" y1="104" x2="73" y2="176" stroke="#00E5FF" stroke-width="2.5"/>
    <circle cx="135" cy="140" r="12" fill="#00F5D4"/>
  </g>

  <!-- Title & Tagline -->
  <text x="255" y="102" class="title" font-size="52">PERMAFROST</text>
  <rect x="655" y="65" width="118" height="34" rx="8" fill="#0D3B66" stroke="#00E5FF" stroke-width="1.5"/>
  <text x="674" y="88" class="badge-text" font-size="16">pfrost CLI</text>

  <text x="255" y="145" class="subtitle" font-size="20">
    Universal Block-Deduplicated Version &amp; Snapshot Time Machine in Terminal
  </text>
  <text x="255" y="175" class="subtitle" font-size="15" fill="#7DA2C1">
    Congela, compara y alterna versiones de proyectos, web apps, estados de Terraform y binarios en milisegundos.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(255, 202)">
    <rect x="0" y="0" width="150" height="32" rx="16" fill="#091E3A" stroke="#00F5D4" stroke-width="1.2"/>
    <text x="16" y="21" class="badge-text">⚡ FastCDC Blocks</text>

    <rect x="162" y="0" width="142" height="32" rx="16" fill="#091E3A" stroke="#00E5FF" stroke-width="1.2"/>
    <text x="178" y="21" class="badge-text">🛡 Safe Switch</text>

    <rect x="316" y="0" width="166" height="32" rx="16" fill="#091E3A" stroke="#4CC9F0" stroke-width="1.2"/>
    <text x="332" y="21" class="badge-text">🔍 Time-Travel Diff</text>

    <rect x="494" y="0" width="168" height="32" rx="16" fill="#091E3A" stroke="#00F5D4" stroke-width="1.2"/>
    <text x="510" y="21" class="badge-text">🔒 Zero-Knowledge</text>

    <rect x="674" y="0" width="128" height="32" rx="16" fill="#091E3A" stroke="#00E5FF" stroke-width="1.2"/>
    <text x="692" y="21" class="badge-text">🚀 Teleport</text>
  </g>
</svg>
